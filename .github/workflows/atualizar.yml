name: Atualizar painel do personagem

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache dos pacotes pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('**/requirements.txt') }}-v1
          restore-keys: pip-

      - name: Cache do Chromium (Playwright)
        uses: actions/cache@v4
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Instalar dependências Python
        run: pip install --quiet playwright requests pillow

      - name: Instalar Chromium (só se não estiver em cache)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Instalar dependências do sistema para o Chromium em cache
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Gerar os dados
        run: python gerar_dados.py --nome Ashokemon --realm Icecrown --frames 12

      - name: Commitar se algo mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados/

          if git diff --staged --quiet; then
            echo "Nada mudou desde a última execução."
          else
            git commit -m "atualiza personagem — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "Dados atualizados e publicados."
          fi
